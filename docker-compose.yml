# Telegram Bot Service — separate from the crawler (own database, no user data in the crawler).
services:
  bot-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vacancies_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${BOT_DB_PASSWORD:?set BOT_DB_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - bot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d vacancies_bot"]
      interval: 10s
      retries: 6
    mem_limit: 256m

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${BOT_DB_PASSWORD}@bot-db:5432/vacancies_bot
    depends_on:
      bot-db:
        condition: service_healthy
    mem_limit: 384m
    # If the bot runs on the crawler host, the crawler API can also be reached internally, e.g.
    # CRAWLER_BASE_URL=http://api:8000/api/bot/v1 with `networks: [default, crawdler_default]`.

volumes:
  bot-db:
