[project]
name = "vacancies-bot"
version = "2.0.0"
description = "DACH Job Bot 2.0 — AI Career Assistant (Telegram) on top of the Germany Career Crawler Bot API"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "cryptography>=42",
  "structlog>=24.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "datamodel-code-generator>=0.25"]

[project.scripts]
vacancies-bot = "vacancies_bot.main:cli"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vacancies_bot = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM108", "B008", "SIM102", "SIM105", "E731"]

[tool.ruff.lint.per-file-ignores]
"src/vacancies_bot/crawler/models_generated.py" = ["ALL"]
"migrations/*" = ["ALL"]
"src/vacancies_bot/bot/texts.py" = ["E501"]
"tests/*" = ["E501", "ASYNC109"]
"src/vacancies_bot/testing/*" = ["E501"]
